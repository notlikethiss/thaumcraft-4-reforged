modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
bannerFile="thaumcraft:textures/gui/branding/poster.png"
iconFile="thaumcraft:textures/gui/branding/icon.png"
iconBlur=true
logoFile="assets/thaumcraft/textures/gui/branding/icon.png"
authors="${mod_authors}"
credits="${mod_credits}"
description='''
Adding a touch of magic to Minecraft. Unofficial port of Thaumcraft 4.2.3.5.
'''

[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="terrablender"
    type="required"
    versionRange="[26.3.0.0.9,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="roughlyenoughitems"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
